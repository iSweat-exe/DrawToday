# Path-based labels, applied to every PR by .github/workflows/auto-label.yml (actions/labeler).
# Only labels listed here are managed (added and removed) by the labeler: all others are left alone.
# Label names, colours and descriptions live in .github/labels.yml.
# A new domain = a new `src/features/<domain>/` folder: add its label in labels.yml, here, in the three issue forms
# (.github/ISSUE_TEMPLATE/) and in .github/scripts/auto-label-issue.sh.

"area: auth":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/auth/**
          - src/app/*auth*/**
          - src/lib/supabase/**
          - src/proxy.ts
          - src/proxy.test.ts

"area: database":
  - changed-files:
      - any-glob-to-any-file:
          - supabase/**
          - src/lib/database.types.ts
          - docs/database.md

"area: exercises":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/exercises/**
          - src/app/**/exercises/**
          - src/lib/data/exercises*

"area: tips":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/tips/**
          - src/app/**/tips/**
          - src/lib/data/tips*

"area: videos":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/videos/**
          - src/app/**/videos/**
          - src/lib/data/videos*

"area: progress":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/progress/**
          - src/app/**/progress/**
          - src/lib/data/progress*

"area: profile":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/profile/**
          - src/app/**/profil*/**
          - src/app/**/profile/**
          - src/lib/data/profiles*
          - src/components/avatar*

"area: settings":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/settings/**
          - src/app/**/settings/**

"area: health":
  - changed-files:
      - any-glob-to-any-file:
          - src/features/health/**
          - src/app/api/health/**
          - src/app/api/keep-alive/**
          - src/lib/data/health*
          - src/components/sampled-analytics*

"area: ui":
  - changed-files:
      - any-glob-to-any-file:
          - src/components/**
          - src/app/globals.css
          - src/app/layout.tsx
          - src/app/**/layout.tsx
          - design/**
          - docs/adr/0003-design-system-tokens.md
          - docs/adr/0004-design-system-components.md
          - docs/design-system.md
          - src/app/**/design-system/**

"area: pwa":
  - changed-files:
      - any-glob-to-any-file:
          - public/sw.js
          - public/icons/**
          - src/app/manifest.ts
          - src/app/icon.png
          - src/components/service-worker-register*

"area: infra":
  - changed-files:
      - any-glob-to-any-file:
          - .github/**
          - .husky/**
          - vercel.json
          - commitlint.config.mjs
          - release-please-config.json
          - .release-please-manifest.json
          - eslint.config.mjs
          - vitest.config.ts
          - playwright.config.ts
          - load/**

# Only for PRs that change nothing but documentation (a feature that updates its docs is not an area: docs PR).
"area: docs":
  - changed-files:
      - any-glob-to-all-files:
          - docs/**
          - .dev/**
          - CLAUDE.md
          - AGENTS.md
          - README.md

# --- flags ---------------------------------------------------------------------------------------------------------

migration:
  - changed-files:
      - any-glob-to-any-file: supabase/migrations/**

